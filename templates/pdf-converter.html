<html>
<head>
    <title>PDF Converter</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav>
    <div class="logo">CONVERTER</div>

    <ul>
        <li onclick="location.href='/'">Home</li>
    </ul>
</nav>

<section class="hero">

    <h1>PDF Converter</h1>

    <p>Convert PDF Files Online</p>

    <form action="/convert-pdf"
      method="POST"
      enctype="multipart/form-data"
      class="upload-box">

        <input type="file" name="pdf" required>

        <select>
            <option>PDF → JPG</option>
            <option>PDF → PNG</option>
            <option>PDF → DOCX</option>
        </select>

        <button type="submit">
            Convert PDF
        </button>

    </form>

</section>

</body>
</html>
